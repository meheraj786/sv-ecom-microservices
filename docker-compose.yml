services:
  # 1. Shared Cache Database (Redis)
  redis:
    image: redis:alpine
    container_name: ecommerce_redis
    ports:
      - "6379:6379"
    networks:
      - ecommerce-network

  # 2. Central API Gateway (NestJS BFF on Port 3000)
  api-gateway:
    build:
      context: ./api-gateway
      dockerfile: Dockerfile
    container_name: api_gateway
    environment:
      - PORT=3000
      - JWT_SECRET_KEY=${JWT_SECRET_KEY}
      - USER_SERVICE_URL=http://user-service:3001
      - PRODUCT_SERVICE_URL=http://product-service:3002
      - CART_SERVICE_URL=http://cart-service:3003
      - INVENTORY_SERVICE_URL=http://inventory-service:3004
      - ORDER_SERVICE_URL=http://order-service:3005
    depends_on:
      - user-service
      - product-service
      - cart-service
      - inventory-service
      - order-service
    networks:
      - ecommerce-network

  # 3. User Service (Mongoose + MongoDB on HTTP 3001)
  user-service:
    build:
      context: ./user-service
      dockerfile: Dockerfile
    container_name: user_service
    environment:
      - PORT=3001
      - DATABASE_URL=${USER_SERVICE_DB_URL}
      - JWT_SECRET_KEY=${JWT_SECRET_KEY}
      - RABBITMQ_URL=${RABBITMQ_URL}
    networks:
      - ecommerce-network

  # 4. Product Service (Prisma + Postgres on HTTP 3002)
  product-service:
    build:
      context: ./product-service
      dockerfile: Dockerfile
    container_name: product_service
    environment:
      - PORT=3002
      - DATABASE_URL=${PRODUCT_SERVICE_WRITE_DB_URL}
      - REPLICA_DATABASE_URL=${PRODUCT_SERVICE_READ_DB_URL}
    networks:
      - ecommerce-network

  # 5. Cart Service (Redis on HTTP 3003)
  cart-service:
    build:
      context: ./cart-service
      dockerfile: Dockerfile
    container_name: cart_service
    environment:
      - PORT=3003
      - REDIS_URL=redis://redis:6379
    depends_on:
      - redis
    networks:
      - ecommerce-network

  # 6. Inventory Service (Prisma + Postgres on HTTP 3004 + RMQ Listener)
  inventory-service:
    build:
      context: ./inventory-service
      dockerfile: Dockerfile
    container_name: inventory_service
    environment:
      - PORT=3004
      - DATABASE_URL=${INVENTORY_SERVICE_DB_URL}
      - RABBITMQ_URL=${RABBITMQ_URL}
      - CART_SERVICE_URL=http://cart-service:3003
    networks:
      - ecommerce-network

  # 7. Order Service (Prisma + Postgres on HTTP 3005 + RMQ Publisher)
  order-service:
    build:
      context: ./order-service
      dockerfile: Dockerfile
    container_name: order_service
    environment:
      - PORT=3005
      - DATABASE_URL=${ORDER_SERVICE_DB_URL}
      - RABBITMQ_URL=${RABBITMQ_URL}
      - CART_SERVICE_URL=http://cart-service:3003
      - INVENTORY_SERVICE_URL=http://inventory-service:3004
    depends_on:
      - redis
    networks:
      - ecommerce-network

  # 8. Global Nginx Gateway (The Front Door - Port 80)
  gateway:
    build:
      context: ./gateway
      dockerfile: Dockerfile
    container_name: global_gateway
    ports:
      - "80:80"
    depends_on:
      - api-gateway
    networks:
      - ecommerce-network

networks:
  ecommerce-network:
    driver: bridge
