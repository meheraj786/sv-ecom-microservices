syntax = "proto3";

package cart;

service CartGrpcService {
  rpc GetCart (CartRequest) returns (CartResponse);
  rpc AddToCart (AddToCartRequest) returns (CartResponse);
  rpc RemoveFromCart (RemoveFromCartRequest) returns (CartResponse);
  rpc ClearCart (CartRequest) returns (ClearCartResponse);
}

message CartRequest {
  string userId = 1;
}

message CartItem {
  string productId = 1;
  int32 quantity = 2;
  double price = 3;
}

message CartResponse {
  repeated CartItem items = 1;
}

message AddToCartRequest {
  string userId = 1;
  string productId = 2;
  int32 quantity = 3;
  double price = 4;
}

message RemoveFromCartRequest {
  string userId = 1;
  string productId = 2;
}

message ClearCartResponse {
  string message = 1;
}